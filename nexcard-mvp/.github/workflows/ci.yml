name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Audit high+
        run: npm audit --audit-level=high
      - name: E2E smoke
        # Non-blocking for now: needs CYPRESS_LOGIN_EMAIL / CYPRESS_LOGIN_PASSWORD
        # (a real Supabase test account, admin role) added as repo secrets first —
        # none exist yet (`gh secret list` is empty as of 2026-08-20). Once added,
        # drop `continue-on-error` to make this blocking, matching the rest of the
        # gate. Also needs REACT_APP_SUPABASE_URL/ANON_KEY if the smoke suite is to
        # exercise real Supabase auth rather than the local mock server.
        continue-on-error: true
        env:
          CYPRESS_login_email: ${{ secrets.CYPRESS_LOGIN_EMAIL }}
          CYPRESS_login_password: ${{ secrets.CYPRESS_LOGIN_PASSWORD }}
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        run: npm run test:e2e:smoke
      - name: Dist secret scan
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const patterns = [/SENDGRID/i, /SERVICE_ROLE_KEY/i, /SUPABASE_SERVICE_ROLE/i, /[A-Z0-9]+_API_KEY/];
          const hits = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (/\.(js|css|html|json|map)$/i.test(entry.name)) {
                const content = fs.readFileSync(full, 'utf8');
                if (patterns.some((pattern) => pattern.test(content))) hits.push(full);
              }
            }
          }
          walk('dist');
          if (hits.length) {
            console.error('Potential secret marker found in dist:', hits.join('\n'));
            process.exit(1);
          }
          NODE
